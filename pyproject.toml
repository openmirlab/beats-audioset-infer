[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[project]
name = "beats-audioset-infer"
dynamic = ["version"]
description = "Standalone BEATs AudioSet tagging and native patch embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND BSD-2-Clause"
authors = [{name = "Sanyuan Chen"}, {name = "Yu Wu"}, {name = "Chengyi Wang"}, {name = "Shujie Liu"}, {name = "Daniel Tompkins"}, {name = "Zhuo Chen"}, {name = "Furu Wei"}]
maintainers = [{name = "openmirlab"}]
dependencies = ["torch>=2.7.1", "numpy>=1.26", "soundfile>=0.12", "filelock>=3.13"]
[project.scripts]
beats-audioset-infer = "beats_audioset_infer.cli:main"
[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.12"]
[tool.hatch.version]
path = "src/beats_audioset_infer/__about__.py"
[tool.hatch.build.targets.wheel]
packages = ["src/beats_audioset_infer"]
[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "tools/", "docs/", "README.md", "CLAUDE.md", "CHANGELOG.md", "LICENSE", "NOTICE", "pyproject.toml", ".gitignore", ".github/"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"docs/FAIRSEQ_LICENSE" = "beats_audioset_infer/licenses/FAIRSEQ_LICENSE"
"docs/TORCHAUDIO_LICENSE" = "beats_audioset_infer/licenses/TORCHAUDIO_LICENSE.txt"
[tool.ruff]
target-version = "py310"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
# Preserve the original Kaldi VTLN variable names in verbatim dependency math.
"src/beats_audioset_infer/_impl/kaldi.py" = ["E741"]
